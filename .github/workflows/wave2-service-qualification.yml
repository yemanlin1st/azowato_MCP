name: wave2-service-qualification

on:
  pull_request:
    paths:
      - "api/server.ts"
      - "config/upstream-pins.json"
      - "config/devfabric-wave2.json"
      - "config/egress-policy.json"
      - ".github/workflows/wave2-service-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wave2-services-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: qualify-${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        service: [openrag, nine-drive, ollama, tabby, three-cx]
    steps:
      - name: Checkout control plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Qualify service
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.service }}" in
            openrag)
              python -m pip install "openrag==0.7.1"
              openrag --help >/tmp/openrag-help.txt
              test -s /tmp/openrag-help.txt

              git init /tmp/openrag
              git -C /tmp/openrag remote add origin https://github.com/langflow-ai/openrag.git
              git -C /tmp/openrag fetch --depth 1 origin ba80be6d8a10081b926d897c883395f6c54f76ef
              git -C /tmp/openrag checkout --detach FETCH_HEAD
              test "$(git -C /tmp/openrag rev-parse HEAD)" = "ba80be6d8a10081b926d897c883395f6c54f76ef"
              cd /tmp/openrag
              export OPENRAG_VERSION=0.7.1
              export OPENSEARCH_PASSWORD='Ci-OpenRAG-9!Strong'
              export SESSION_SECRET='ci_session_secret_000000000000000000000000'
              export JWT_SIGNING_KEY='ci_jwt_signing_key_000000000000000000000'
              export OPENRAG_ENCRYPTION_KEY='Y2lfb3BlbnJhZ19lbmNyeXB0aW9uX2tleV8zMmJ5dGVz'
              export LANGFLOW_SECRET_KEY='ci_langflow_secret_0000000000000000000000'
              export LANGFLOW_SUPERUSER_PASSWORD='Ci-Langflow-9!Strong'
              export LANGFLOW_KEY='ci_langflow_key_000000000000000000000000'
              docker compose config -q
              docker compose config > /tmp/openrag-compose.txt
              ! grep -q 'your-secret-key-change-in-production' /tmp/openrag-compose.txt
              grep -q 'openrag-backend' /tmp/openrag-compose.txt
              grep -q 'opensearch' /tmp/openrag-compose.txt
              grep -q 'langflow' /tmp/openrag-compose.txt
              grep -q '/mcp' README.md
              ;;

            nine-drive)
              git init /tmp/9drive
              git -C /tmp/9drive remote add origin https://github.com/zenhosta/9drive.git
              git -C /tmp/9drive fetch --depth 1 origin 811d4a2137538b73abb43d195d7bf452e01b0c58
              git -C /tmp/9drive checkout --detach FETCH_HEAD
              test "$(git -C /tmp/9drive rev-parse HEAD)" = "811d4a2137538b73abb43d195d7bf452e01b0c58"

              cd /tmp/9drive/backend
              npm ci --no-audit --no-fund
              npm run build
              cd /tmp/9drive/frontend
              npm ci --no-audit --no-fund
              npm run build

              cd /tmp/9drive
              export MYSQL_ROOT_PASSWORD="$(openssl rand -hex 20)"
              export MYSQL_DATABASE="nine_drive_ci"
              export MYSQL_USER="nine_drive_ci"
              export MYSQL_PASSWORD="$(openssl rand -hex 20)"
              export JWT_ACCESS_SECRET="$(openssl rand -hex 32)"
              export TOKEN_ENCRYPTION_KEY="$(openssl rand -hex 16)"
              export FRONTEND_URL="http://127.0.0.1:5173"
              export VITE_API_URL="http://127.0.0.1:4000"
              docker compose config -q
              docker compose config >/tmp/9drive-compose.txt
              ! grep -q 'change-this' /tmp/9drive-compose.txt
              trap 'docker compose down -v || true' EXIT
              docker compose up -d --build mysql backend
              for i in $(seq 1 60); do
                code=$(curl -s -o /tmp/9drive-health.json -w '%{http_code}' http://127.0.0.1:4000/health || true)
                [ "$code" = "200" ] && break
                sleep 2
              done
              test "$code" = "200"
              grep -q '"status":"ok"' /tmp/9drive-health.json
              ;;

            ollama)
              docker pull ollama/ollama:0.34.2
              docker run -d --rm --name ollama-ci -p 11434:11434 ollama/ollama:0.34.2
              trap 'docker stop ollama-ci || true' EXIT
              for i in $(seq 1 45); do
                code=$(curl -s -o /tmp/ollama-tags.json -w '%{http_code}' http://127.0.0.1:11434/api/tags || true)
                [ "$code" = "200" ] && break
                sleep 2
              done
              test "$code" = "200"
              node -e 'const j=require("/tmp/ollama-tags.json"); if(!Array.isArray(j.models)) process.exit(1)'
              ;;

            tabby)
              docker pull tabbyml/tabby:0.32.0
              docker run --rm -e TABBY_DISABLE_USAGE_COLLECTION=1 tabbyml/tabby:0.32.0 --version | tee /tmp/tabby-version.txt
              grep -q '0.32.0' /tmp/tabby-version.txt
              docker image inspect tabbyml/tabby:0.32.0 >/tmp/tabby-image.json
              ;;

            three-cx)
              node scripts/validate_3cx_policy.mjs
              ;;
          esac

      - name: Emit evidence
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          node - <<'NODE'
          const fs=require("fs");
          fs.writeFileSync("evidence/service-${{ matrix.service }}.json", JSON.stringify({
            service:"${{ matrix.service }}",
            sha:process.env.GITHUB_SHA,
            runId:process.env.GITHUB_RUN_ID,
            qualification:"completed-by-workflow",
            productionActivated:false
          },null,2));
          NODE

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wave2-service-${{ matrix.service }}-${{ github.run_id }}
          path: evidence/service-${{ matrix.service }}.json
          if-no-files-found: error
          retention-days: 90