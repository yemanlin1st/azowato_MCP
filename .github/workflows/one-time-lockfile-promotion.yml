name: one-time-lockfile-promotion

on:
  push:
    branches:
      - feat/omega-devfabric-r01-20260919

permissions:
  contents: write

concurrency:
  group: one-time-lockfile-promotion
  cancel-in-progress: false

jobs:
  promote-lockfile:
    if: github.actor == 'yemanlin1st'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/omega-devfabric-r01-20260919
          persist-credentials: true

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate lockfile identity
        shell: bash
        run: |
          node -e 'const p=require("./package-lock.json"); if(p.name!=="pefy-meta-supra-capability-mesh-mcp" || p.version!=="2.1.0" || p.lockfileVersion!==3) process.exit(1)'

      - name: Commit lockfile only when changed
        shell: bash
        run: |
          git config user.name "PEFY Qualification Bot"
          git config user.email "38079408+yemanlin1st@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already qualified and unchanged"
            exit 0
          fi
          git diff --cached --name-only | grep -qx 'package-lock.json'
          git commit -m "build: commit qualified dependency lock"
          git push origin HEAD:feat/omega-devfabric-r01-20260919
