name: qualification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Upload generated lockfile evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualified-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7

      - name: TypeScript qualification
        run: npm run typecheck

      - name: ΩDEVFABRIC policy contract
        run: npm run test:logic

      - name: ΩDEVFABRIC egress/security contract
        run: npm run test:egress

      - name: MCP boundary and registry smoke test
        run: timeout 20s npm run test:mcp

      - name: Full network MCP preview smoke
        run: timeout 30s npm run test:mcp-network

      - name: Rollback guard fail-closed contract
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/rollback-evidence"
          set +e
          output=$(PEFY_ROLLBACK_EVIDENCE_DIR="$RUNNER_TEMP/rollback-evidence" python scripts/rollback_guard.py 2>&1)
          code=$?
          set -e
          echo "$output"
          test "$code" -eq 2
          echo "$output" | grep -q '"decision": "BLOCKED_MISSING_HEALTH_URL"'

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Reproducibility contract
        shell: bash
        run: |
          test -f package-lock.json
          node -e 'const p=require("./package-lock.json"); if(p.name!=="pefy-meta-supra-capability-mesh-mcp" || p.version!=="2.1.0" || p.lockfileVersion!==3) process.exit(1)'

  qualify-mini-swe:
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MINI_SWE_COMMIT: a83fcae82d2a08f0ee0c688f9d137b3566c097f8
      MINI_SWE_VERSION: 2.4.6
      SWE_REX_COMMIT: f802b3e14d82aa4c13291d2fda5bd4fd48f36f91
      SWE_REX_VERSION: 1.4.0
      MSWEA_SILENT_STARTUP: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GEMINI_API_KEY: ""
      GOOGLE_API_KEY: ""
      OPENROUTER_API_KEY: ""
      AZURE_OPENAI_API_KEY: ""

    steps:
      - name: Checkout control plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Fetch exact verified upstream sources
        shell: bash
        run: |
          set -euo pipefail
          mini="$RUNNER_TEMP/mini-swe-agent"
          rex="$RUNNER_TEMP/swe-rex"

          git init "$mini"
          git -C "$mini" remote add origin https://github.com/SWE-agent/mini-swe-agent.git
          git -C "$mini" fetch --depth 1 origin "$MINI_SWE_COMMIT"
          git -C "$mini" checkout --detach FETCH_HEAD
          test "$(git -C "$mini" rev-parse HEAD)" = "$MINI_SWE_COMMIT"
          grep -q '__version__ = "2.4.6"' "$mini/src/minisweagent/__init__.py"
          grep -q "MIT License" "$mini/LICENSE.md"

          git init "$rex"
          git -C "$rex" remote add origin https://github.com/SWE-agent/SWE-ReX.git
          git -C "$rex" fetch --depth 1 origin "$SWE_REX_COMMIT"
          git -C "$rex" checkout --detach FETCH_HEAD
          test "$(git -C "$rex" rev-parse HEAD)" = "$SWE_REX_COMMIT"
          grep -q '__version__ = "1.4.0"' "$rex/src/swerex/__init__.py"
          grep -q "MIT License" "$rex/LICENSE.txt"

      - name: Install into disposable virtual environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/swe-venv"
          echo "$RUNNER_TEMP/swe-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/swe-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/swe-venv/bin/python" -m pip install "$RUNNER_TEMP/swe-rex"
          "$RUNNER_TEMP/swe-venv/bin/python" -m pip install "$RUNNER_TEMP/mini-swe-agent"
          "$RUNNER_TEMP/swe-venv/bin/python" -m pip check

      - name: CLI and pinned-version verification
        shell: bash
        run: |
          set -euo pipefail
          mini --help > "$RUNNER_TEMP/mini-help.txt"
          grep -q "Run mini-SWE-agent" "$RUNNER_TEMP/mini-help.txt"
          python - <<'PY'
          import minisweagent, swerex
          assert minisweagent.__version__ == "2.4.6"
          assert swerex.__version__ == "1.4.0"
          print("pinned imports: PASS")
          PY

      - name: Deterministic mini-SWE-agent execution smoke
        run: python scripts/smoke_mini_swe.py

      - name: Compile installed sources
        shell: bash
        run: |
          python -m compileall -q "$RUNNER_TEMP/mini-swe-agent/src/minisweagent"
          python -m compileall -q "$RUNNER_TEMP/swe-rex/src/swerex"

      - name: Write qualification evidence
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          python - <<'PY'
          import json, os
          with open("evidence/swe-agent-qualification.json","w") as f:
              json.dump({
                "runId": os.environ.get("GITHUB_RUN_ID"),
                "controlPlaneSha": os.environ.get("GITHUB_SHA"),
                "miniSWEAgent": {
                  "repository":"SWE-agent/mini-swe-agent",
                  "version":os.environ["MINI_SWE_VERSION"],
                  "commit":os.environ["MINI_SWE_COMMIT"],
                  "deterministicAgentLoop":"executed",
                  "externalModelCalls":0
                },
                "sweRex":{
                  "repository":"SWE-agent/SWE-ReX",
                  "version":os.environ["SWE_REX_VERSION"],
                  "commit":os.environ["SWE_REX_COMMIT"],
                  "sandboxAdapter":"import-qualified"
                },
                "security":{
                  "hostLocalExecution":"ephemeral-ci-only",
                  "permanentHostAutonomy":False,
                  "modelSecretsPresent":False,
                  "productionDeployAuthority":False
                }
              },f,indent=2)
          PY

      - name: Upload SWE qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: swe-agent-qualification-${{ github.run_id }}
          path: evidence/swe-agent-qualification.json
          if-no-files-found: error
          retention-days: 90
