name: wave2-agentic-qualification

on:
  pull_request:
    paths:
      - "api/server.ts"
      - "config/upstream-pins.json"
      - "config/devfabric-wave2.json"
      - "config/egress-policy.json"
      - ".github/workflows/wave2-agentic-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wave2-agentic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: qualify-${{ matrix.tool }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        tool: [mini-swe-agent, swe-rex, aider, codex-cli, continue]
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout control plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install and smoke pinned tool
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.tool }}" in
            mini-swe-agent)
              python -m pip install "mini-swe-agent==2.4.6"
              mini --help >/tmp/tool-help.txt
              python - <<'PY'
          import minisweagent
          print(getattr(minisweagent, "__version__", "unknown"))
          PY
              ;;
            swe-rex)
              python -m pip install "swe-rex==1.4.0"
              swerex-remote --help >/tmp/tool-help.txt
              python -c "import swerex; print(getattr(swerex,'__version__','unknown'))"
              ;;
            aider)
              python -m pip install "aider-chat==0.86.0"
              aider --version | tee /tmp/tool-help.txt
              ;;
            codex-cli)
              npm install -g "@openai/codex@0.155.1" --no-audit --no-fund
              codex --version | tee /tmp/tool-help.txt
              ;;
            continue)
              npm install -g "@continuedev/cli@2.0.0" --no-audit --no-fund
              cn --help >/tmp/tool-help.txt
              ;;
          esac
          test -s /tmp/tool-help.txt

      - name: Sandbox policy contract
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require("fs");
          const pins=JSON.parse(fs.readFileSync("config/upstream-pins.json","utf8"));
          const wave=JSON.parse(fs.readFileSync("config/devfabric-wave2.json","utf8"));
          if(pins.dependencies["mini-swe-agent"].sandboxRequired!==true) process.exit(1);
          if(!String(wave.planes.agenticCoding.execution).includes("SWE-ReX")) process.exit(1);
          if(!String(wave.orchestration.singleWriterRule).includes("Only the selected primary coding agent")) process.exit(1);
          NODE

      - name: Emit evidence
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          node - <<'NODE'
          const fs=require("fs");
          fs.writeFileSync("evidence/agentic-${{ matrix.tool }}.json", JSON.stringify({
            tool:"${{ matrix.tool }}",
            sha:process.env.GITHUB_SHA,
            runId:process.env.GITHUB_RUN_ID,
            qualification:"completed-by-workflow",
            permanentActivation:false,
            note:"Disposable runner install/smoke only; permanent runtime credentials/hardware remain separately gated."
          }, null, 2));
          NODE

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wave2-agentic-${{ matrix.tool }}-${{ github.run_id }}
          path: evidence/agentic-${{ matrix.tool }}.json
          if-no-files-found: error
          retention-days: 90
