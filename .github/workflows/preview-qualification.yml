name: preview-qualification

on:
  pull_request:
    paths:
      - "api/**"
      - "config/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "vercel.json"
      - ".github/workflows/preview-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Secret preflight
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"

      - name: Deterministic dependency install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Local qualification before preview
        run: npm run qualify

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@58.1.0 --ignore-scripts --no-audit --no-fund

      - name: Link isolated Vercel project metadata
        shell: bash
        run: |
          mkdir -p .vercel
          node -e 'const fs=require("fs"); fs.writeFileSync(".vercel/project.json", JSON.stringify({orgId:process.env.VERCEL_ORG_ID,projectId:process.env.VERCEL_PROJECT_ID}))'

      - name: Build and deploy PREVIEW only
        shell: bash
        run: |
          scope=()
          if [ -n "$VERCEL_SCOPE" ]; then scope=(--scope "$VERCEL_SCOPE"); fi
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN" "${scope[@]}"
          vercel build --token="$VERCEL_TOKEN" "${scope[@]}"
          PREVIEW_URL=$(vercel deploy --prebuilt --yes --token="$VERCEL_TOKEN" "${scope[@]}")
          case "$PREVIEW_URL" in
            https://*.vercel.app) ;;
            *) echo "Unexpected preview URL: $PREVIEW_URL" >&2; exit 1 ;;
          esac
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
          echo "::notice title=PEFY Preview::$PREVIEW_URL"

      - name: Health smoke test
        shell: bash
        run: |
          for i in $(seq 1 24); do
            code=$(curl --silent --show-error --output /tmp/health.json --write-out '%{http_code}' "$PREVIEW_URL/api/health" || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 5
          done
          test "$code" = "200"
          cat /tmp/health.json
          node -e 'const fs=require("fs"); const h=JSON.parse(fs.readFileSync("/tmp/health.json","utf8")); if(h.service!=="PEFY-GG Meta Supra Capability Mesh MCP") process.exit(1); if(!["ready","configuration_required"].includes(h.status)) process.exit(1); if(h.mode!=="bearer-protected-read-only" && h.mode!=="fail-closed") process.exit(1)'

      - name: MCP unauthenticated boundary smoke test
        shell: bash
        run: |
          code=$(curl --silent --show-error --output /tmp/mcp-boundary.txt --write-out '%{http_code}' -X POST "$PREVIEW_URL/mcp" -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' || true)
          echo "MCP boundary HTTP=$code"
          test "$code" = "401" -o "$code" = "503"

      - name: Write preview qualification evidence
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          node -e 'const fs=require("fs"); fs.writeFileSync("evidence/preview-qualification.json", JSON.stringify({runId:process.env.GITHUB_RUN_ID,sha:process.env.GITHUB_SHA,previewUrl:process.env.PREVIEW_URL||null,productionAliasMutation:false,qualifiedAt:new Date().toISOString()},null,2))'

      - name: Upload preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pefy-preview-qualification-${{ github.run_id }}
          path: evidence/preview-qualification.json
          if-no-files-found: error
          retention-days: 30
