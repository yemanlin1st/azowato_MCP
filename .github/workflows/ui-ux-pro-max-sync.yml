name: UI UX Pro Max Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"
  push:
    branches: [main]
    paths:
      - "tools/ui-ux-pro-max/**"
      - "capabilities/ui-ux-pro-max.lock.json"
      - ".github/workflows/ui-ux-pro-max-sync.yml"

concurrency:
  group: ui-ux-pro-max-sync-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and validate pinned UI UX Pro Max
        shell: bash
        run: bash tools/ui-ux-pro-max/install-uiux-pro-max.sh

      - name: Enforce generated-asset gates
        shell: bash
        run: |
          set -euo pipefail
          test -f .codex/skills/ui-ux-pro-max/SKILL.md
          test -d .codex/skills/ui-ux-pro-max/data
          test -d .codex/skills/ui-ux-pro-max/scripts
          test -f .codex/skills/ui-ux-pro-max/scripts/search.py
          test -f .github/prompts/ui-ux-pro-max.prompt.md
          test -f .pefy/evidence/ui-ux-pro-max-install.json
          test -f .pefy/evidence/ui-ux-pro-max-validation.json
          grep -q "PEFY-GOVERNANCE-BEGIN" .codex/skills/ui-ux-pro-max/SKILL.md
          grep -q "PEFY-GOVERNANCE-BEGIN" .github/prompts/ui-ux-pro-max.prompt.md

      - name: Upload installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-ux-pro-max-evidence-${{ github.run_id }}
          path: .pefy/evidence/ui-ux-pro-max-*.json
          if-no-files-found: error
          retention-days: 90

      - name: Commit controlled generated assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PEFY-GG Capability Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- \
            .codex/skills/ui-ux-pro-max \
            .github/prompts/ui-ux-pro-max.prompt.md \
            .pefy/evidence/ui-ux-pro-max-install.json \
            .pefy/evidence/ui-ux-pro-max-validation.json
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "chore(uiux): refresh validated UI UX Pro Max assets [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
