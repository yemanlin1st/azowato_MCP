name: UI UX Pro Max Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"
  push:
    branches: [main]
    paths:
      - "tools/ui-ux-pro-max/**"
      - "capabilities/ui-ux-pro-max.lock.json"
      - ".github/workflows/ui-ux-pro-max-sync.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/ui-ux-pro-max/**"
      - "capabilities/ui-ux-pro-max.lock.json"
      - ".github/workflows/ui-ux-pro-max-sync.yml"

concurrency:
  group: ui-ux-pro-max-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve target branch
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "TARGET_BRANCH=${{ github.head_ref }}" >> "$GITHUB_ENV"
          else
            echo "TARGET_BRANCH=${{ github.ref_name }}" >> "$GITHUB_ENV"
          fi

      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install and validate pinned UI UX Pro Max
        shell: bash
        run: bash tools/ui-ux-pro-max/install-uiux-pro-max.sh

      - name: Enforce generated-asset gates
        shell: bash
        run: |
          set -euo pipefail
          test -f .agents/skills/ui-ux-pro-max/SKILL.md
          test -d .agents/skills/ui-ux-pro-max/data
          test -d .agents/skills/ui-ux-pro-max/scripts
          test -f .agents/skills/ui-ux-pro-max/scripts/search.py
          test -f .github/prompts/ui-ux-pro-max.prompt.md
          test -d .github/prompts/ui-ux-pro-max/data
          test -d .github/prompts/ui-ux-pro-max/scripts
          test -f .github/prompts/ui-ux-pro-max/scripts/search.py
          test -f .pefy/evidence/ui-ux-pro-max-install.json
          test -f .pefy/evidence/ui-ux-pro-max-validation.json
          grep -q "PEFY-GOVERNANCE-BEGIN" .agents/skills/ui-ux-pro-max/SKILL.md
          grep -q "PEFY-GOVERNANCE-BEGIN" .github/prompts/ui-ux-pro-max.prompt.md

      - name: Upload installation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-ux-pro-max-evidence-${{ github.run_id }}
          path: .pefy/evidence/ui-ux-pro-max-*.json
          if-no-files-found: error
          retention-days: 90

      - name: Commit controlled generated assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PEFY-GG Capability Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- \
            .agents/skills/ui-ux-pro-max \
            .github/prompts/ui-ux-pro-max.prompt.md \
            .github/prompts/ui-ux-pro-max \
            .pefy/evidence/ui-ux-pro-max-install.json \
            .pefy/evidence/ui-ux-pro-max-validation.json
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "chore(uiux): refresh validated UI UX Pro Max assets [skip ci]"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
