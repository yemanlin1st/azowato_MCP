name: gstack-pinned-qualification

on:
  pull_request:
    paths:
      - "config/upstream-pins.json"
      - "config/egress-policy.json"
      - "api/server.ts"
      - ".github/workflows/gstack-pinned-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gstack-pinned-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify-gstack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GSTACK_COMMIT: a6b3a57512ca6d5c6aa5b68f74f736195021f96e
      GSTACK_VERSION: 1.87.4.0
      GSTACK_HOME: ${{ github.workspace }}/.ci/gstack-state
      CODEX_HOME: ${{ github.workspace }}/.ci/codex-home
      GSTACK_PLAN_TUNE_HOOKS: "no"
    steps:
      - name: Checkout control plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.10"

      - name: Fetch exact gstack commit
        shell: bash
        run: |
          set -euo pipefail
          src="${RUNNER_TEMP}/gstack-src"
          mkdir -p "$src"
          git -C "$src" init
          git -C "$src" remote add origin https://github.com/garrytan/gstack.git
          git -C "$src" fetch --depth 1 origin "$GSTACK_COMMIT"
          git -C "$src" checkout --detach FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = "$GSTACK_COMMIT"
          test "$(cat "$src/VERSION")" = "$GSTACK_VERSION"
          grep -q "MIT License" "$src/LICENSE"

      - name: Apply sovereign settings before setup
        shell: bash
        run: |
          set -euo pipefail
          src="${RUNNER_TEMP}/gstack-src"
          mkdir -p "$GSTACK_HOME" "$CODEX_HOME"
          "$src/bin/gstack-config" set telemetry off
          "$src/bin/gstack-config" set proactive false
          "$src/bin/gstack-config" set auto_upgrade false
          "$src/bin/gstack-config" set update_check false
          "$src/bin/gstack-config" set codex_reviews disabled
          "$src/bin/gstack-config" set artifacts_sync_mode off
          "$src/bin/gstack-config" set artifacts_sync_mode_prompted true
          "$src/bin/gstack-config" set pair_agent off
          "$src/bin/gstack-config" set memorable_recall off
          "$src/bin/gstack-config" set checkpoint_push false
          "$src/bin/gstack-config" set plan_tune_hooks no
          "$src/bin/gstack-config" set design_detector off
          "$src/bin/gstack-config" set transcript_ingest_mode off

      - name: Install pinned gstack into disposable Codex home
        shell: bash
        run: |
          set -euo pipefail
          src="${RUNNER_TEMP}/gstack-src"
          cd "$src"
          ./setup --host codex --prefix --no-team --quiet
          test -d "$CODEX_HOME/skills"
          find "$CODEX_HOME/skills" -maxdepth 2 -name SKILL.md -print | tee "${RUNNER_TEMP}/gstack-skills.txt"
          test -s "${RUNNER_TEMP}/gstack-skills.txt"

      - name: Verify sovereign runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          src="${RUNNER_TEMP}/gstack-src"
          test "$("$src/bin/gstack-config" get telemetry)" = "off"
          test "$("$src/bin/gstack-config" get proactive)" = "false"
          test "$("$src/bin/gstack-config" get auto_upgrade)" = "false"
          test "$("$src/bin/gstack-config" get update_check)" = "false"
          test "$("$src/bin/gstack-config" get codex_reviews)" = "disabled"
          test "$("$src/bin/gstack-config" get artifacts_sync_mode)" = "off"
          test "$("$src/bin/gstack-config" get pair_agent)" = "off"
          test "$("$src/bin/gstack-config" get memorable_recall)" = "off"
          test "$("$src/bin/gstack-config" get checkpoint_push)" = "false"
          test "$("$src/bin/gstack-config" get plan_tune_hooks)" = "no"
          test "$("$src/bin/gstack-config" get design_detector)" = "off"
          test "$("$src/bin/gstack-config" get transcript_ingest_mode)" = "off"
          "$src/bin/gstack-egress" grants | tee "${RUNNER_TEMP}/gstack-egress-grants.txt"

      - name: Run targeted upstream security/config tests
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/gstack-src"
          bun test             test/gstack-config-defaults.test.ts             test/gstack-config-memorable-key.test.ts             test/gstack-egress-cli.test.ts             test/egress-receipt.test.ts             test/egress-receipt-wiring.test.ts

      - name: Produce qualification evidence
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          node - <<'NODE'
          const fs=require("fs");
          const skillsPath=process.env.RUNNER_TEMP+"/gstack-skills.txt";
          const grantsPath=process.env.RUNNER_TEMP+"/gstack-egress-grants.txt";
          const evidence={
            qualifiedAt:new Date().toISOString(),
            upstream:"garrytan/gstack",
            version:process.env.GSTACK_VERSION,
            commit:process.env.GSTACK_COMMIT,
            installTarget:"disposable-github-runner-codex-home",
            permanentMachineActivation:false,
            telemetry:"off",
            autoUpgrade:false,
            updateCheck:false,
            skills:fs.existsSync(skillsPath)?fs.readFileSync(skillsPath,"utf8").trim().split("\n").filter(Boolean):[],
            egressGrants:fs.existsSync(grantsPath)?fs.readFileSync(grantsPath,"utf8"):null
          };
          fs.writeFileSync("evidence/gstack-qualification.json",JSON.stringify(evidence,null,2));
          NODE

      - name: Upload gstack qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gstack-qualification-${{ github.run_id }}
          path: evidence/gstack-qualification.json
          if-no-files-found: error
          retention-days: 90